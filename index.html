<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa Livre – Sinuca e lazer da faculdade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap">
<style>
:root{--bg:#eaf0ee;--card:#fff;--tx:#10231a;--mu:#5a6b62;--bd:#d6dfdb;--felt:#0e5a3a;--felt2:#d9efe3;--ok:#0e7a4b;--warn:#a86a00;--bad:#c0392b;--info:#2f5fd0;--wood:#b9824a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d1612;--card:#15211b;--tx:#e6f0ea;--mu:#93a69b;--bd:#26372e;--felt:#3fbf85;--felt2:#17382a;--ok:#4fd08f;--warn:#e0a63c;--bad:#ef6a5a;--info:#7da2ff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1612;--card:#15211b;--tx:#e6f0ea;--mu:#93a69b;--bd:#26372e;--felt:#3fbf85;--felt2:#17382a;--ok:#4fd08f;--warn:#e0a63c;--bad:#ef6a5a;--info:#7da2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:Sora,system-ui,sans-serif;margin:0;line-height:1.2}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;color:var(--tx)}
.ball{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#f2c230 14%);border:2px solid var(--tx)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;color:var(--mu);padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--felt);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#06140d}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin-bottom:4px}h2{font-size:19px;margin:28px 0 12px}h3{font-size:16px}
.sub{color:var(--mu);margin:0 0 18px;max-width:60ch}
.tabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.tabs a{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);text-decoration:none;font-size:14px;cursor:pointer;background:var(--card)}
.tabs a.on{border-color:var(--felt);color:var(--felt);background:var(--felt2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.eq{cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s}
.eq:hover,.eq:focus-visible{border-color:var(--felt);outline:none}
.eq .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.loc{color:var(--mu);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-disponivel,.s-resolvida{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.s-ocupada,.s-andamento{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.s-manutencao,.s-aberta{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.row{display:flex;gap:16px;flex-wrap:wrap}.row>.grow{flex:1;min-width:260px}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;border:1px solid var(--bd);line-height:0}
.qr small{display:block;line-height:1.3;color:#333;text-align:center;font-size:11px;margin-top:6px}
.btn{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--felt);color:#fff}
:root[data-theme="dark"] .btn{color:#06140d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06140d}}
.btn.ghost{background:none;color:var(--felt);border:1px solid var(--felt)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
textarea{min-height:84px;resize:vertical}
.opt{display:flex;gap:8px}.opt button{flex:1}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.oc{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--bd)}
.oc:first-child{border-top:0}
.oc .b{flex:1;min-width:0}.oc p{margin:2px 0 6px;overflow-wrap:anywhere}
.meta{color:var(--mu);font-size:13px}
.steps{display:flex;gap:4px;margin-top:8px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.steps i.f{background:var(--felt)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{font:700 28px Sora,sans-serif;display:block}
.bar{height:10px;border-radius:5px;background:var(--felt);min-width:4px}
.rank{display:grid;grid-template-columns:150px 1fr 30px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.back{background:none;border:0;color:var(--mu);font:inherit;cursor:pointer;padding:0;margin-bottom:12px}
.empty{color:var(--mu);padding:18px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20}
.sel{width:auto;padding:6px 8px;font-size:14px}
@media (max-width:520px){.rank{grid-template-columns:100px 1fr 24px}}
@media print{header,.tabs,.noprint{display:none}}
</style>
</head>
<body>
<header>
  <button class="brand" onclick="nav('')"><span class="ball"></span>Mesa Livre</button>
  <div class="seg" role="group" aria-label="Perfil">
    <button id="r-aluno" onclick="setRole('aluno')">Aluno</button>
    <button id="r-admin" onclick="setRole('admin')">Administração</button>
  </div>
</header>
<main id="app"></main>
<script>
var TIPOS={disponivel:'Disponível',ocupada:'Em uso',manutencao:'Em manutenção'};
var OCS={aberta:'Aberta',andamento:'Em andamento',resolvida:'Resolvida'};
var MATERIAIS=['Taco','Giz','Jogo de bolas','Triângulo','Bolinha de pebolim','Raquete'];
var EQ=[
 {id:'mesa1',nome:'Mesa de sinuca 1',tipo:'Sinuca',local:'Cantina, térreo',st:'disponivel'},
 {id:'mesa2',nome:'Mesa de sinuca 2',tipo:'Sinuca',local:'Cantina, térreo',st:'ocupada'},
 {id:'mesa3',nome:'Mesa de sinuca 3',tipo:'Sinuca',local:'Área de convivência, bloco B',st:'manutencao'},
 {id:'pebolim',nome:'Pebolim',tipo:'Pebolim',local:'Área de convivência, bloco B',st:'disponivel'},
 {id:'pingue',nome:'Tênis de mesa',tipo:'Tênis de mesa',local:'Pátio coberto',st:'disponivel'}
];
var OC=[
 {id:1,eq:'mesa3',tp:'problema',cat:'Pano rasgado',desc:'Rasgo de uns 10 cm perto da caçapa do canto esquerdo.',foto:'',st:'andamento',data:'2026-10-21'},
 {id:2,eq:'mesa2',tp:'material',cat:'Giz',desc:'Acabou o giz da mesa.',foto:'',st:'resolvida',data:'2026-10-24'},
 {id:3,eq:'mesa3',tp:'problema',cat:'Taco quebrado',desc:'Taco com a ponta solta.',foto:'',st:'resolvida',data:'2026-10-12'}
];
var role='aluno',pending='',tipoForm='problema',filtro='todas';
try{var s=JSON.parse(localStorage.getItem('mesalivre')||'null');if(s){EQ=s.EQ;OC=s.OC}}catch(e){}
function save(){try{localStorage.setItem('mesalivre',JSON.stringify({EQ:EQ,OC:OC}))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
function eq(id){return EQ.filter(function(e){return e.id===id})[0]}
function fmt(d){var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function pill(c,t){return '<span class="pill s-'+c+'">'+t+'</span>'}
function nav(h){if(location.hash.slice(1)===h){render()}else{location.hash=h}}
function setRole(r){role=r;nav('');render()}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function base(){return location.href.split('#')[0]}
function qr(el,id){try{new QRCode(el,{text:base()+'#'+id,width:128,height:128})}catch(e){el.textContent='QR indisponível'}}
function steps(st){var n={aberta:1,andamento:2,resolvida:3}[st];return '<div class="steps" title="'+OCS[st]+'">'+[1,2,3].map(function(i){return '<i class="'+(i<=n?'f':'')+'"></i>'}).join('')+'</div>'}
function ocItem(o,showEq){
 var e=eq(o.eq);
 return '<div class="oc">'+(o.foto?'<img class="thumb" alt="Foto anexada" src="'+o.foto+'">':'')+'<div class="b"><div class="meta">'+(showEq&&e?esc(e.nome)+' · ':'')+(o.tp==='material'?'Material':'Problema')+': '+esc(o.cat)+' · '+fmt(o.data)+'</div><p>'+esc(o.desc)+'</p>'+pill(o.st,OCS[o.st])+steps(o.st)+'</div></div>'}

function render(){
 $('r-aluno').className=role==='aluno'?'on':'';$('r-admin').className=role==='admin'?'on':'';
 var h=location.hash.slice(1),a=$('app');
 if(role==='admin')return admin(a);
 if(eq(h))return detalhe(a,eq(h));
 if(h==='acompanhar')return acompanhar(a);
 home(a);
}
function tabs(on){return '<nav class="tabs"><a class="'+(on==='h'?'on':'')+'" onclick="nav(\'\')" tabindex="0">Equipamentos</a><a class="'+(on==='a'?'on':'')+'" onclick="nav(\'acompanhar\')" tabindex="0">Minhas solicitações</a></nav>'}
function home(a){
 a.innerHTML=tabs('h')+'<h1>O que está livre agora?</h1><p class="sub">Veja a situação das mesas e dos equipamentos de lazer. Em cada mesa há um QR Code: aponte a câmera para abrir a página dela direto.</p><div class="grid">'+
 EQ.map(function(e){return '<div class="card eq" tabindex="0" role="button" onclick="nav(\''+e.id+'\')" onkeydown="if(event.key===\'Enter\')nav(\''+e.id+'\')"><div class="top"><h3>'+esc(e.nome)+'</h3>'+pill(e.st,TIPOS[e.st])+'</div><span class="loc">'+esc(e.local)+'</span><span class="meta">'+OC.filter(function(o){return o.eq===e.id&&o.st!=='resolvida'}).length+' ocorrência(s) em aberto</span></div>'}).join('')+'</div>';
}
function acompanhar(a){
 a.innerHTML=tabs('a')+'<h1>Minhas solicitações</h1><p class="sub">Acompanhe se o pedido foi recebido, está em andamento ou já foi resolvido.</p><div class="card">'+(OC.length?OC.slice().sort(function(x,y){return y.id-x.id}).map(function(o){return ocItem(o,true)}).join(''):'<div class="empty">Nenhuma solicitação ainda. Abra um equipamento para informar um problema ou pedir material.</div>')+'</div>';
}
function detalhe(a,e){
 pending='';
 var lista=OC.filter(function(o){return o.eq===e.id}).sort(function(x,y){return y.id-x.id});
 a.innerHTML='<button class="back" onclick="nav(\'\')">← Voltar aos equipamentos</button><div class="row"><div class="grow"><h1>'+esc(e.nome)+'</h1><p class="loc" style="margin:4px 0 10px">'+esc(e.local)+'</p>'+pill(e.st,TIPOS[e.st])+
 (e.st==='manutencao'?'<p class="sub" style="margin-top:12px">Esta mesa está fora de uso até o conserto. Você pode acompanhar o andamento abaixo.</p>':'')+
 '</div><div class="qr" id="qrbox"><small>Escaneie para abrir<br>'+esc(e.nome)+'</small></div></div>'+
 '<h2>O que você precisa?</h2><div class="card"><div class="opt"><button class="btn '+(tipoForm==='problema'?'':'ghost')+'" onclick="tipoForm=\'problema\';detalhe($(\'app\'),eq(\''+e.id+'\'))">Informar problema</button><button class="btn '+(tipoForm==='material'?'':'ghost')+'" onclick="tipoForm=\'material\';detalhe($(\'app\'),eq(\''+e.id+'\'))">Solicitar material</button></div>'+
 '<label for="cat">'+(tipoForm==='material'?'Material':'Tipo de problema')+'</label><select id="cat">'+
 (tipoForm==='material'?MATERIAIS:['Pano rasgado','Taco quebrado','Caçapa travada','Mesa desnivelada','Dano na estrutura','Outro']).map(function(x){return '<option>'+x+'</option>'}).join('')+'</select>'+
 '<label for="desc">'+(tipoForm==='material'?'Observação (quantidade, urgência)':'O que aconteceu?')+'</label><textarea id="desc" placeholder="'+(tipoForm==='material'?'Ex.: precisamos de 2 tacos':'Descreva o dano e onde ele está')+'"></textarea>'+
 (tipoForm==='problema'?'<label for="foto">Foto (opcional)</label><input id="foto" type="file" accept="image/*" onchange="foto(this)"><div id="prev"></div>':'')+
 '<p style="margin:16px 0 0"><button class="btn" onclick="enviar(\''+e.id+'\')">Enviar solicitação</button></p></div>'+
 '<h2>Histórico desta mesa</h2><div class="card">'+(lista.length?lista.map(function(o){return ocItem(o,false)}).join(''):'<div class="empty">Sem ocorrências registradas.</div>')+'</div>';
 qr($('qrbox'),e.id);
}
function foto(inp){
 var f=inp.files[0];if(!f)return;
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  pending=c.toDataURL('image/jpeg',.7);$('prev').innerHTML='<img class="thumb" style="margin-top:8px" alt="Prévia da foto" src="'+pending+'">'};im.src=r.result};
 r.readAsDataURL(f);
}
function enviar(id){
 var d=$('desc').value.trim();
 if(!d){toast('Descreva a solicitação antes de enviar');$('desc').focus();return}
 OC.push({id:Date.now(),eq:id,tp:tipoForm,cat:$('cat').value,desc:d,foto:tipoForm==='problema'?pending:'',st:'aberta',data:new Date().toISOString().slice(0,10)});
 pending='';save();toast('Solicitação enviada');detalhe($('app'),eq(id));
}
function admin(a){
 var cnt={aberta:0,andamento:0,resolvida:0};OC.forEach(function(o){cnt[o.st]++});
 var manut=EQ.filter(function(e){return e.st==='manutencao'}).length;
 var vis=OC.filter(function(o){return filtro==='todas'||o.st===filtro}).sort(function(x,y){return y.id-x.id});
 var rank=EQ.map(function(e){return{e:e,n:OC.filter(function(o){return o.eq===e.id&&o.tp==='problema'}).length}}).sort(function(x,y){return y.n-x.n});
 var mx=Math.max(1,rank[0].n);
 a.innerHTML='<h1>Painel da administração</h1><p class="sub">Demandas dos alunos, situação dos equipamentos e histórico de problemas em um só lugar.</p>'+
 '<div class="stats"><div class="card stat"><b>'+cnt.aberta+'</b>abertas</div><div class="card stat"><b>'+cnt.andamento+'</b>em andamento</div><div class="card stat"><b>'+cnt.resolvida+'</b>resolvidas</div><div class="card stat"><b>'+manut+'</b>equip. em manutenção</div></div>'+
 '<h2>Demandas</h2><div class="tabs">'+['todas','aberta','andamento','resolvida'].map(function(f){return '<a class="'+(filtro===f?'on':'')+'" tabindex="0" onclick="filtro=\''+f+'\';render()">'+(f==='todas'?'Todas':OCS[f])+'</a>'}).join('')+'</div><div class="card">'+
 (vis.length?vis.map(function(o){var e=eq(o.eq);return '<div class="oc">'+(o.foto?'<img class="thumb" alt="Foto anexada" src="'+o.foto+'">':'')+'<div class="b"><div class="meta">'+esc(e?e.nome:'')+' · '+(o.tp==='material'?'Material':'Problema')+': '+esc(o.cat)+' · '+fmt(o.data)+'</div><p>'+esc(o.desc)+'</p><label class="meta" style="margin:0 0 4px" for="st'+o.id+'">Status</label><select class="sel" id="st'+o.id+'" onchange="mudaOc('+o.id+',this.value)">'+Object.keys(OCS).map(function(k){return '<option value="'+k+'"'+(o.st===k?' selected':'')+'>'+OCS[k]+'</option>'}).join('')+'</select></div></div>'}).join(''):'<div class="empty">Nenhuma demanda neste filtro.</div>')+'</div>'+
 '<h2>Situação dos equipamentos</h2><div class="card">'+EQ.map(function(e){return '<div class="oc" style="align-items:center"><div class="b"><strong>'+esc(e.nome)+'</strong><div class="meta">'+esc(e.local)+'</div></div><select class="sel" aria-label="Situação de '+esc(e.nome)+'" onchange="mudaEq(\''+e.id+'\',this.value)">'+Object.keys(TIPOS).map(function(k){return '<option value="'+k+'"'+(e.st===k?' selected':'')+'>'+TIPOS[k]+'</option>'}).join('')+'</select></div>'}).join('')+'</div>'+
 '<h2>Quem mais dá problema</h2><div class="card">'+rank.map(function(r){return '<div class="rank"><span>'+esc(r.e.nome)+'</span><div class="bar" style="width:'+(r.n/mx*100)+'%"></div><b>'+r.n+'</b></div>'}).join('')+'<p class="meta" style="margin-bottom:0">Conta apenas problemas informados, não pedidos de material.</p></div>'+
 '<h2>QR Codes das mesas</h2><p class="noprint"><button class="btn ghost" onclick="window.print()">Imprimir QR Codes</button></p><div class="grid" id="qrs">'+EQ.map(function(e){return '<div class="card" style="text-align:center"><div class="qr" id="q-'+e.id+'"><small>'+esc(e.nome)+'</small></div></div>'}).join('')+'</div>';
 EQ.forEach(function(e){qr($('q-'+e.id),e.id)});
}
function mudaOc(id,v){OC.forEach(function(o){if(o.id===id)o.st=v});save();toast('Status atualizado')}
function mudaEq(id,v){eq(id).st=v;save();toast('Situação atualizada')}
window.addEventListener('hashchange',render);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" onload="render()" onerror="render()"></script>
<script>render()</script>
</body>
</html>
